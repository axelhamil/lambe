<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>How rivers shape valleys - YouTube</title>
    <meta name="description" content="A short look at how water carves the land over thousands of years." />
  </head>
  <body>
    <ytd-app>
      <ytd-watch-flexy>
        <div id="player-container">
          <div id="movie_player" class="html5-video-player ytp-autohide playing-mode">
            <div class="html5-video-container">
              <video class="video-stream html5-main-video" tabindex="-1"></video>
            </div>
            <div class="ytp-caption-window-container" id="ytp-caption-window-container">
              <div class="caption-window ytp-caption-window-bottom">
                <span class="ytp-caption-segment">rivers carve the valley</span>
              </div>
            </div>
            <div class="ytp-chrome-bottom">
              <div class="ytp-chrome-controls">
                <div class="ytp-left-controls">
                  <button class="ytp-play-button ytp-button" aria-label="Pause (k)"></button>
                </div>
                <div class="ytp-right-controls">
                  <button class="ytp-subtitles-button ytp-button" aria-label="Subtitles/closed captions (c)" aria-pressed="false"></button>
                  <button class="ytp-settings-button ytp-button" aria-label="Settings"></button>
                  <button class="ytp-fullscreen-button ytp-button" aria-label="Full screen (f)"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <ytd-watch-metadata>
          <div id="title"><h1 class="style-scope ytd-watch-metadata"> <yt-formatted-string>How rivers shape
            valleys</yt-formatted-string> </h1></div>
          <ytd-channel-name id="channel-name"><div id="text-container"><a href="/@earthlab">Earth Lab</a></div></ytd-channel-name>
        </ytd-watch-metadata>
      </ytd-watch-flexy>
    </ytd-app>
  </body>
</html>
