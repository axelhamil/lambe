name: release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish again (for example v0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository == 'axelhamil/lambe' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bot.outputs.token }}
          target-branch: develop
      - if: steps.release.outputs.release_created
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
      - if: steps.release.outputs.release_created
        run: git push origin HEAD:refs/heads/main

  publish:
    needs: release
    if: >-
      !cancelled() && github.repository == 'axelhamil/lambe'
      && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    env:
      TAG_NAME: ${{ inputs.tag || needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - id: zip
        run: tooling/ci/build-zips.sh
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          UNPACKED_ZIP: ${{ steps.zip.outputs.unpacked }}
          STORE_ZIP: ${{ steps.zip.outputs.store }}
        run: gh release upload "$TAG_NAME" "$UNPACKED_ZIP" "$STORE_ZIP" --clobber --repo "$GITHUB_REPOSITORY"
      - id: store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: tooling/ci/store-secrets.sh
      - if: steps.store.outputs.configured == 'true'
        env:
          CHROME_API_VERSION: v2
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          STORE_ZIP: ${{ steps.zip.outputs.store }}
        run: tooling/ci/publish-store.sh "$STORE_ZIP"
